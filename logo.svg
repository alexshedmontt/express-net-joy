<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <!-- Background -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#ffffff"></stop>
      <stop offset="100%" stop-color="#666666"></stop>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bg)"></rect>

  <!-- Stylized U (tech / signal style) -->
  <g stroke="#232323" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <!-- Left pillar -->
    <path d="M160 160 V300"></path>

    <!-- Right pillar -->
    <path d="M352 160 V300"></path>

    <!-- Bottom curve (smooth U shape) -->
    <path d="M160 300 
             Q256 400 352 300"></path>

    <!-- Inner accent (gives “VPN / signal” feel) -->
    <path d="M220 220 V290"></path>
    <path d="M292 220 V290"></path>

  </g>

</svg>